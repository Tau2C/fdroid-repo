name: Update and Deploy F-Droid Repository

on:
  push:
    branches:
      - master
    paths:
      - 'repo/**'
      - 'config.yml'
      - 'apps.json'
      - 'metadata/**'
  workflow_dispatch:
  repository_dispatch:
    types: [new-release]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore commit modification times
        uses: chetan/git-restore-mtime-action@v2

      - name: Install and cache fdroidserver
        uses: gerlero/apt-install@v1
        with:
          packages: fdroidserver
          cache: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.p12
            chmod 600 keystore.p12
          else
            echo "::error::Secret FDROID_KEYSTORE_BASE64 is not set."
            exit 1
          fi

      - name: Fetch APKs from GitHub Releases
        env:
          DEFAULT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_TOKENS: ${{ secrets.REPO_TOKENS }}
        run: |
          chmod +x scripts/fetch-apks.sh
          ./scripts/fetch-apks.sh apps.json repo

      - name: Update repository index
        env:
          FDROID_KEY_STORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_PASS: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          chmod 600 config.yml
          mkdir -p repo archive
          fdroid update -v --create-metadata --use-date-from-apk

      - name: Prepare site directory
        run: |
          mkdir -p _site/fdroid
          cp -r repo _site/fdroid/
          if [ -d archive ]; then
            cp -r archive _site/fdroid/
          fi
          # Add simple index landing page
          cat << 'EOF' > _site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Personal F-Droid Repository</title>
            <style>
              body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
              code { background: #f4f4f4; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
            </style>
          </head>
          <body>
            <h1>Personal F-Droid Repository</h1>
            <p>Scan or add this repository URL into your F-Droid client:</p>
            <p><code>https://Tau2C.github.io/fdroid-repo/fdroid/repo</code></p>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
